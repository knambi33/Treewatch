<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Badge Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />

  <g filter="url(#glow)">
    <!-- Tree Trunk -->
    <path d="M236 290 L276 290 L288 410 C288 418 280 424 272 424 L240 424 C232 424 224 418 224 410 Z" fill="url(#trunkGrad)" />
    <!-- Root flare -->
    <path d="M224 410 Q200 424 175 428 Q195 416 230 404 Z" fill="#78350f" />
    <path d="M288 410 Q312 424 337 428 Q317 416 282 404 Z" fill="#78350f" />

    <!-- Canopy Layer 1 (Bottom foliage) -->
    <path d="M128 320 C110 260 160 210 210 230 C230 180 300 180 320 220 C360 210 400 250 384 310 C384 350 330 360 300 340 C280 360 230 360 212 340 C180 360 130 350 128 320 Z" fill="#059669" />

    <!-- Canopy Layer 2 (Middle foliage) -->
    <path d="M150 270 C140 210 190 170 230 190 C250 140 310 140 330 180 C370 180 390 230 360 270 C340 300 300 290 280 280 C260 300 220 300 200 280 C170 300 140 290 150 270 Z" fill="#10b981" />

    <!-- Canopy Layer 3 (Top crown foliage) -->
    <path d="M180 210 C180 150 230 110 270 130 C290 90 340 100 350 140 C380 160 370 210 330 220 C310 240 270 240 250 220 C220 230 180 230 180 210 Z" fill="url(#leafGrad)" />

    <!-- Center Sprout / Bud of Life -->
    <path d="M256 90 C240 120 230 150 256 180 C282 150 272 120 256 90 Z" fill="#fde047" />
    <path d="M256 120 L256 170" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
